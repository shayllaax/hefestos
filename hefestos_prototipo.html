<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hefestos — Registro de decisões de projeto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --petroleo:#18485F;
    --medio:#387798;
    --acinzentado:#4A5C6A;
    --grafite:#272727;
    --claro:#AEB3B7;
    --base:#F8FAFA;
    --petroleo-10:#18485F1a;
    --medio-10:#3877981a;
    --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--base);
    color:var(--grafite);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Poppins',sans-serif;font-weight:600;color:var(--grafite);margin:0}
  a{color:var(--medio)}
  button{font-family:'Inter',sans-serif;cursor:pointer}
  .mono{font-family:'Inter',monospace;font-variant-numeric:tabular-nums}

  /* ---- layout shells ---- */
  #app{min-height:100vh}
  .shell{max-width:1180px;margin:0 auto;padding:0 28px}
  .center-shell{max-width:480px;margin:0 auto;padding:80px 24px}

  /* ---- top switcher (demo affordance) ---- */
  .demo-bar{
    background:var(--petroleo);
    color:#fff;
    font-size:12.5px;
    padding:9px 0;
  }
  .demo-bar .shell{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .demo-bar strong{font-weight:600}
  .demo-bar-links{display:flex;gap:6px}
  .demo-bar-links button{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);
    color:#fff;
    padding:5px 12px;
    border-radius:999px;
    font-size:12px;
    transition:background .15s;
  }
  .demo-bar-links button.active{background:#fff;color:var(--petroleo);border-color:#fff;font-weight:600}
  .demo-bar-links button:not(.active):hover{background:rgba(255,255,255,.22)}

  /* ---- entry / gate screen ---- */
  .gate{padding:64px 24px 90px}
  .gate-head{max-width:640px;margin:0 auto 48px;text-align:center}
  .gate-head .eyebrow{color:var(--medio);font-weight:600;font-size:13px;letter-spacing:.02em;margin-bottom:10px}
  .gate-head h1{font-size:30px;line-height:1.25;margin-bottom:14px}
  .gate-head p{color:var(--acinzentado);font-size:15.5px}
  .gate-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:820px;margin:0 auto}
  @media(max-width:720px){.gate-cards{grid-template-columns:1fr}}
  .gate-card{
    background:#fff;
    border:1px solid var(--claro);
    border-radius:var(--radius);
    padding:26px 24px;
    text-align:left;
    transition:border-color .15s, transform .15s;
  }
  .gate-card:hover{border-color:var(--medio)}
  .gate-card .tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--medio);border:1px solid var(--medio);border-radius:999px;padding:3px 10px;margin-bottom:14px}
  .gate-card h3{font-size:18px;margin-bottom:8px}
  .gate-card p{color:var(--acinzentado);font-size:14px;margin-bottom:18px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--petroleo);color:#fff;border:none;border-radius:var(--radius);
    padding:11px 18px;font-size:14.5px;font-weight:600;transition:background .15s;
  }
  .btn:hover{background:#123748}
  .btn.secondary{background:transparent;color:var(--petroleo);border:1px solid var(--petroleo)}
  .btn.secondary:hover{background:var(--petroleo-10)}
  .btn.block{width:100%}
  .btn.small{padding:7px 13px;font-size:13px}
  .btn.ghost{background:transparent;color:var(--acinzentado);border:1px solid var(--claro)}
  .btn.ghost:hover{border-color:var(--acinzentado)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---- app dashboard shell ---- */
  .topbar{background:#fff;border-bottom:1px solid var(--claro)}
  .topbar .shell{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:700;color:var(--petroleo);font-size:17px}
  .brand .mark{width:26px;height:26px;background:var(--petroleo);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
  .who{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--acinzentado)}
  .who .role-pill{background:var(--petroleo-10);color:var(--petroleo);font-weight:600;font-size:11.5px;padding:3px 10px;border-radius:999px}
  .role-pill.client{background:var(--medio-10);color:var(--medio)}

  .page{padding:32px 0 80px}
  .crumb{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .crumb button{background:none;border:none;color:var(--medio);font-size:13.5px;font-weight:600;padding:0}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
  .page-head h1{font-size:23px}
  .page-head .sub{color:var(--acinzentado);font-size:14px;margin-top:5px;max-width:56ch}
  .actions-row{display:flex;gap:10px;flex-wrap:wrap}

  /* ---- stat strip ---- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--claro);border:1px solid var(--claro);border-radius:var(--radius);overflow:hidden;margin-bottom:28px}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:#fff;padding:16px 18px}
  .stat span{display:block;font-size:11.5px;color:var(--acinzentado);margin-bottom:6px}
  .stat strong{font-size:22px;font-family:'Poppins',sans-serif;color:var(--grafite)}

  /* ---- project list ---- */
  .proj-list{display:flex;flex-direction:column;gap:10px}
  .proj-row{
    background:#fff;border:1px solid var(--claro);border-radius:var(--radius);
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    transition:border-color .15s;
  }
  .proj-row:hover{border-color:var(--medio)}
  .proj-row h3{font-size:15.5px;margin-bottom:3px}
  .proj-row .meta{color:var(--acinzentado);font-size:13px}
  .proj-row .counts{color:var(--acinzentado);font-size:12.5px;margin-top:4px}

  .empty{
    border:1px dashed var(--claro);border-radius:var(--radius);padding:40px 24px;text-align:center;color:var(--acinzentado);
  }
  .empty strong{display:block;color:var(--grafite);font-size:15px;margin-bottom:6px}

  /* ---- forms ---- */
  .form{max-width:560px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--grafite);margin-bottom:6px}
  .field .hint{font-size:12px;color:var(--acinzentado);margin-top:5px}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--claro);border-radius:var(--radius);padding:10px 12px;
    font-family:'Inter',sans-serif;font-size:14.5px;color:var(--grafite);background:#fff;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--medio);outline-offset:1px;border-color:var(--medio)}
  .field textarea{min-height:78px;resize:vertical}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.field-row{grid-template-columns:1fr}}
  .form-actions{display:flex;gap:10px;margin-top:22px}

  /* ---- project detail ---- */
  .grid-2{display:grid;grid-template-columns:2.1fr 1fr;gap:22px;align-items:start}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr}}
  .panel{background:#fff;border:1px solid var(--claro);border-radius:var(--radius)}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--claro);display:flex;align-items:center;justify-content:space-between}
  .panel-head h4{font-size:13px}
  .panel-body{padding:16px 18px}

  .env-group{margin-bottom:22px}
  .env-group h3{font-size:14px;color:var(--acinzentado);font-weight:600;text-transform:none;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--claro)}
  .item-row{
    display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid #EEF1F2;
  }
  .item-row:last-child{border-bottom:none}
  .item-main{flex:1;min-width:0}
  .item-main .line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
  .item-main .item-name{font-weight:600;font-size:14.5px}
  .item-main .cat{color:var(--acinzentado);font-size:12.5px}
  .item-main .prod{color:var(--acinzentado);font-size:13.5px}
  .ver-badge{font-family:'Inter',monospace;font-size:11px;color:var(--acinzentado);background:var(--base);border:1px solid var(--claro);border-radius:4px;padding:1px 6px}
  .status-badge{font-size:11px;font-weight:600;border-radius:4px;padding:2px 8px}
  .status-badge.pendente{background:#FBF3E4;color:#8A5A1C;border:1px solid #E7CFA0}
  .status-badge.aprovado{background:#E9F1EC;color:#1F6B45;border:1px solid #BEDCC7}
  .item-actions{display:flex;gap:6px;flex-shrink:0}

  /* ---- timeline ---- */
  .timeline{position:relative;padding-left:22px}
  .timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--claro)}
  .tl-entry{position:relative;padding-bottom:22px}
  .tl-entry:last-child{padding-bottom:0}
  .tl-dot{position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--medio);border:2px solid #fff;box-shadow:0 0 0 1px var(--medio)}
  .tl-dot.client{background:var(--petroleo);box-shadow:0 0 0 1px var(--petroleo)}
  .tl-when{font-size:11.5px;color:var(--acinzentado);font-family:'Inter',monospace}
  .tl-actor{font-size:12.5px;font-weight:600;margin:2px 0 5px}
  .tl-actor.client{color:var(--petroleo)}
  .tl-actor.arch{color:var(--medio)}
  .tl-what{font-size:13.5px;color:var(--grafite);margin-bottom:4px}
  .tl-diff{font-size:12.5px;color:var(--acinzentado);background:var(--base);border:1px solid var(--claro);border-radius:4px;padding:8px 10px;line-height:1.55}
  .tl-diff b{color:var(--grafite)}

  .side-note{font-size:13px;color:var(--acinzentado);line-height:1.6}
  .side-note strong{color:var(--grafite);display:block;margin-bottom:6px;font-size:12.5px}

  .share-box{background:var(--base);border:1px solid var(--claro);border-radius:4px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-top:10px}
  .share-box .url{flex:1;font-family:'Inter',monospace;font-size:12px;color:var(--acinzentado);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- client portal ---- */
  .client-hero{background:var(--petroleo);color:#fff;padding:34px 0 30px}
  .client-hero .shell{max-width:760px}
  .client-hero .eyebrow{color:#AFD0DE;font-size:12.5px;font-weight:600;margin-bottom:8px}
  .client-hero h1{color:#fff;font-size:22px;margin-bottom:6px}
  .client-hero p{color:#D8E6EC;font-size:14px}
  .client-body{max-width:760px;margin:0 auto;padding:28px 24px 90px}
  .pending-card{
    background:#fff;border:1px solid var(--claro);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;
  }
  .pending-card.is-pending{border-color:#E7CFA0}
  .pending-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px}
  .pending-card h3{font-size:15.5px}
  .pending-card .desc{color:var(--acinzentado);font-size:13.5px;margin-bottom:14px;line-height:1.6}
  .confirm-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid #EEF1F2;padding-top:14px;margin-top:4px}
  .confirm-row input{border:1px solid var(--claro);border-radius:4px;padding:8px 10px;font-size:13.5px;font-family:'Inter',sans-serif;flex:1;min-width:180px}
  .confirmed-note{font-size:13px;color:#1F6B45;background:#E9F1EC;border:1px solid #BEDCC7;border-radius:4px;padding:8px 12px}

  .foot-note{font-size:12px;color:var(--acinzentado);text-align:center;margin-top:26px;line-height:1.6}

  /* ---- print doc ---- */
  @media print{
    .no-print{display:none!important}
    body{background:#fff}
  }
  .doc-preview{background:#fff;border:1px solid var(--claro);border-radius:var(--radius);padding:0;overflow:hidden}
  .doc-preview iframe{width:100%;height:70vh;border:none;display:block}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--grafite);color:#fff;padding:11px 18px;border-radius:6px;font-size:13.5px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="demo-bar no-print">
  <div class="shell">
    <span><strong>Protótipo de demonstração</strong> — não representa um sistema de contas real</span>
    <div class="demo-bar-links">
      <button id="db-arch" onclick="goArchitect()">Visão do arquiteto</button>
      <button id="db-client" onclick="goClientPortal()">Visão do cliente</button>
      <button id="db-gate" onclick="goGate()">Início</button>
    </div>
  </div>
</div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ estado e armazenamento ============ */
const KEY='hefestos_proto_v1';
function loadState(){
  const raw=localStorage.getItem(KEY);
  if(raw){try{return JSON.parse(raw)}catch(e){}}
  return seed();
}
function saveState(){localStorage.setItem(KEY, JSON.stringify(state))}
let state = loadState();

function seed(){
  const now=fmtNow();
  const s={
    projects:[
      {
        id:'p1',
        name:'Apartamento Chaves',
        client:'Renata Chaves',
        ref:'AP-014',
        createdAt:fmtDate(-34),
        updatedAt:fmtDate(-1),
        items:[
          {id:'i1',environment:'Banheiro social',itemName:'Revestimento de parede',category:'Revestimentos',brand:'Portobello',productName:'Porcelanato Munari Grigio', details:'60x60 cm · acetinado · retificado', notes:'', version:2, status:'aprovado'},
          {id:'i2',environment:'Banheiro social',itemName:'Rejunte',category:'Rejuntes',brand:'Quartzolit',productName:'Rejunte Flex Cinza Platina', details:'junta 3mm', notes:'', version:1, status:'aprovado'},
          {id:'i3',environment:'Cozinha',itemName:'Bancada',category:'Pedras',brand:'Compac',productName:'Quartzo Unique White', details:'2cm · borda reta', notes:'Cliente pediu troca do granito original por quartzo por questão de manutenção.', version:2, status:'pendente'},
        ],
        history:[
          {id:'h3',itemId:'i3',itemName:'Bancada',type:'alteracao',actor:'arquiteto',actorName:'Carina Garbi',date:fmtDate(-1),oldValue:'Granito Preto São Gabriel · 2cm',newValue:'Quartzo Unique White · 2cm · borda reta',reason:'Cliente solicitou substituição por menor necessidade de manutenção.'},
          {id:'h2',itemId:'i2',itemName:'Rejunte',type:'aprovacao',actor:'cliente',actorName:'Renata Chaves',date:fmtDate(-9),reason:''},
          {id:'h1b',itemId:'i2',itemName:'Rejunte',type:'proposta',actor:'arquiteto',actorName:'Carina Garbi',date:fmtDate(-10),oldValue:'—',newValue:'Rejunte Flex Cinza Platina · junta 3mm',reason:'Especificação inicial.'},
          {id:'h1a',itemId:'i1',itemName:'Revestimento de parede',type:'aprovacao',actor:'cliente',actorName:'Renata Chaves',date:fmtDate(-9),reason:''},
          {id:'h1',itemId:'i1',itemName:'Revestimento de parede',type:'proposta',actor:'arquiteto',actorName:'Carina Garbi',date:fmtDate(-10),oldValue:'—',newValue:'Porcelanato Munari Grigio · 60x60 · acetinado',reason:'Especificação inicial.'},
        ],
      }
    ],
    account:{name:'Carina Garbi', plan:'Hefestos Pro'},
  };
  localStorage.setItem(KEY, JSON.stringify(s));
  return s;
}
function resetDemo(){localStorage.removeItem(KEY); state=loadState(); route='gate'; render()}

/* ============ util ============ */
function fmtDate(offsetDays){
  const d=new Date(); d.setDate(d.getDate()+offsetDays);
  return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function fmtNow(){return fmtDate(0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9)}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__ttimer); window.__ttimer=setTimeout(()=>t.classList.remove('show'),2400);
}
function findProject(id){return state.projects.find(p=>p.id===id)}

/* ============ router ============ */
let route='gate'; // gate | archDash | archProject | archNewProject | archAddItem | archTimeline | clientPortal | clientHistory
let ctx={};
function nav(r,c={}){route=r;ctx=c;render();window.scrollTo(0,0)}
function goGate(){nav('gate')}
function goArchitect(){nav('archDash')}
function goClientPortal(){nav('clientPortal',{projectId:state.projects[0]?.id})}
function syncBar(){
  document.getElementById('db-arch').classList.toggle('active', route.startsWith('arch'));
  document.getElementById('db-client').classList.toggle('active', route.startsWith('client'));
}

/* ============ render root ============ */
function render(){
  syncBar();
  const app=document.getElementById('app');
  if(route==='gate') app.innerHTML=viewGate();
  else if(route.startsWith('arch')) app.innerHTML=viewArchitectShell();
  else if(route.startsWith('client')) app.innerHTML=viewClientShell();
}

/* ============ GATE ============ */
function viewGate(){
  return `
  <div class="gate">
    <div class="shell gate-head">
      <div class="eyebrow">HEFESTOS · PROTÓTIPO</div>
      <h1>Cada decisão de projeto, registrada por quem propôs e confirmada por quem aprovou.</h1>
      <p>Este protótipo mostra as duas pontas da Hefestos: o ambiente de trabalho do arquiteto e a tela que o cliente recebe para confirmar cada especificação. Escolha um lado para explorar.</p>
    </div>
    <div class="gate-cards">
      <div class="gate-card">
        <span class="tag">ARQUITETO</span>
        <h3>Ambiente de trabalho</h3>
        <p>Organize projetos por ambiente, especifique materiais, acompanhe versões e envie cada decisão para a confirmação do cliente.</p>
        <button class="btn block" onclick="goArchitect()">Entrar como arquiteto</button>
      </div>
      <div class="gate-card">
        <span class="tag">CLIENTE</span>
        <h3>Link de confirmação</h3>
        <p>É a tela que o cliente do arquiteto recebe — sem precisar criar conta — para revisar e confirmar as especificações do seu projeto.</p>
        <button class="btn secondary block" onclick="goClientPortal()">Abrir como cliente</button>
      </div>
    </div>
    <p style="text-align:center;margin-top:34px"><button class="btn ghost small" onclick="resetDemo()">Reiniciar dados de demonstração</button></p>
  </div>`;
}

/* ============ ARCHITECT SHELL ============ */
function viewArchitectShell(){
  let body='';
  if(route==='archDash') body=archDashboard();
  else if(route==='archProject') body=archProjectDetail(ctx.projectId);
  else if(route==='archNewProject') body=archNewProject();
  else if(route==='archAddItem') body=archAddItem(ctx.projectId, ctx.environment||'', ctx.itemId||null);
  else if(route==='archTimeline') body=archTimeline(ctx.projectId);
  return `
  <div class="topbar"><div class="shell">
    <div class="brand"><span class="mark">H</span>Hefestos</div>
    <div class="who"><span class="role-pill">Arquiteto</span>${esc(state.account.name)}</div>
  </div></div>
  <div class="page"><div class="shell">${body}</div></div>`;
}

function archDashboard(){
  const ps=state.projects;
  const totalItems=ps.reduce((a,p)=>a+p.items.length,0);
  const pending=ps.reduce((a,p)=>a+p.items.filter(i=>i.status==='pendente').length,0);
  const confirmations=ps.reduce((a,p)=>a+p.history.filter(h=>h.type==='aprovacao').length,0);
  return `
  <div class="page-head">
    <div><h1>Seus projetos</h1><div class="sub">Cada especificação fica registrada com quem propôs, quem confirmou e quando.</div></div>
    <div class="actions-row"><button class="btn" onclick="nav('archNewProject')">Novo projeto</button></div>
  </div>
  <div class="stats">
    <div class="stat"><span>PROJETOS</span><strong>${ps.length}</strong></div>
    <div class="stat"><span>ITENS ESPECIFICADOS</span><strong>${totalItems}</strong></div>
    <div class="stat"><span>AGUARDANDO CONFIRMAÇÃO</span><strong>${pending}</strong></div>
    <div class="stat"><span>CONFIRMAÇÕES DO CLIENTE</span><strong>${confirmations}</strong></div>
  </div>
  <div class="proj-list">
    ${ps.length?ps.map(p=>{
      const pend=p.items.filter(i=>i.status==='pendente').length;
      return `<div class="proj-row">
        <div>
          <h3>${esc(p.name)}</h3>
          <div class="meta">${esc(p.client||'Sem cliente vinculado')} ${p.ref?'· '+esc(p.ref):''}</div>
          <div class="counts">${p.items.length} itens · ${p.history.length} eventos registrados ${pend?`· <strong style="color:#8A5A1C">${pend} aguardando confirmação</strong>`:''}</div>
        </div>
        <button class="btn secondary small" onclick="nav('archProject',{projectId:'${p.id}'})">Abrir projeto</button>
      </div>`}).join(''):`<div class="empty"><strong>Nenhum projeto ainda</strong>Crie um projeto para começar a registrar especificações.</div>`}
  </div>`;
}

function archNewProject(){
  return `
  <div class="crumb"><button onclick="nav('archDash')">← Voltar</button></div>
  <div class="page-head"><div><h1>Novo projeto</h1><div class="sub">As especificações ficarão organizadas por ambiente dentro deste projeto.</div></div></div>
  <form class="form" onsubmit="event.preventDefault(); createProject()">
    <div class="field"><label>Nome do projeto</label><input id="npName" required placeholder="Ex.: Apartamento Rocha"></div>
    <div class="field-row">
      <div class="field"><label>Cliente</label><input id="npClient" placeholder="Nome do cliente"></div>
      <div class="field"><label>Identificação interna</label><input id="npRef" placeholder="Ex.: AP-031"></div>
    </div>
    <div class="form-actions"><button type="button" class="btn ghost" onclick="nav('archDash')">Cancelar</button><button class="btn" type="submit">Criar projeto</button></div>
  </form>`;
}
function createProject(){
  const name=document.getElementById('npName').value.trim();
  if(!name)return;
  const p={id:uid('p'),name,client:document.getElementById('npClient').value.trim(),ref:document.getElementById('npRef').value.trim(),createdAt:fmtNow(),updatedAt:fmtNow(),items:[],history:[]};
  state.projects.unshift(p); saveState();
  nav('archProject',{projectId:p.id});
}

function archProjectDetail(id){
  const p=findProject(id); if(!p)return `<div class="empty">Projeto não encontrado.</div>`;
  const envs=[...new Set(p.items.map(i=>i.environment))];
  const pendingCount=p.items.filter(i=>i.status==='pendente').length;
  const lastEvent=p.history[0];
  return `
  <div class="crumb"><button onclick="nav('archDash')">← Meus projetos</button></div>
  <div class="page-head">
    <div><h1>${esc(p.name)}</h1><div class="sub">${esc(p.client||'Sem cliente')} ${p.ref?'· '+esc(p.ref):''} · atualizado em ${esc(p.updatedAt)}</div></div>
    <div class="actions-row">
      <button class="btn secondary" onclick="nav('archAddItem',{projectId:'${p.id}'})">Adicionar especificação</button>
      <button class="btn" onclick="nav('archTimeline',{projectId:'${p.id}'})">Ver linha do tempo</button>
    </div>
  </div>
  <div class="grid-2">
    <div>
      ${envs.length?envs.map(env=>`
        <div class="env-group">
          <h3>${esc(env)}</h3>
          ${p.items.filter(i=>i.environment===env).map(item=>`
            <div class="item-row">
              <div class="item-main">
                <div class="line1">
                  <span class="item-name">${esc(item.itemName)}</span>
                  <span class="cat">· ${esc(item.category)}</span>
                  <span class="ver-badge">v${item.version}</span>
                  <span class="status-badge ${item.status}">${item.status==='aprovado'?'Confirmado pelo cliente':'Aguardando confirmação'}</span>
                </div>
                <div class="prod">${esc(item.brand)} — ${esc(item.productName)}${item.details?' · '+esc(item.details):''}</div>
              </div>
              <div class="item-actions">
                <button class="btn ghost small" onclick="nav('archAddItem',{projectId:'${p.id}',itemId:'${item.id}'})">Alterar</button>
              </div>
            </div>`).join('')}
        </div>`).join(''):`<div class="empty"><strong>Nenhuma especificação ainda</strong>Adicione o primeiro item para este projeto.<div style="margin-top:14px"><button class="btn small" onclick="nav('archAddItem',{projectId:'${p.id}'})">Adicionar especificação</button></div></div>`}
    </div>
    <aside>
      <div class="panel" style="margin-bottom:16px">
        <div class="panel-head"><h4>STATUS DE CONFIRMAÇÃO</h4></div>
        <div class="panel-body side-note">
          ${pendingCount?`<strong>${pendingCount} especificação(ões) aguardando o cliente</strong>Enquanto não forem confirmadas pelo cliente, elas aparecem como pendentes na linha do tempo.`:`<strong>Tudo confirmado</strong>Todas as especificações atuais já têm confirmação registrada do cliente.`}
          <div class="share-box"><span class="url">hefestos.app/c/${p.id}</span><button class="btn ghost small" onclick="copyLink('${p.id}')">Copiar link</button></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h4>ÚLTIMO EVENTO</h4></div>
        <div class="panel-body side-note">
          ${lastEvent?`<strong>${esc(lastEvent.itemName)}</strong>${lastEvent.type==='aprovacao'?'Confirmado pelo cliente':'Registrado pelo arquiteto'} · ${esc(lastEvent.date)}`:`<strong>Nenhum evento ainda</strong>`}
        </div>
      </div>
    </aside>
  </div>`;
}

function copyLink(pid){
  toast('Link de demonstração copiado — use "Visão do cliente" para simular o acesso do cliente.');
}

function archAddItem(projectId, environment, itemId){
  const p=findProject(projectId); if(!p)return '';
  const editing = itemId ? p.items.find(i=>i.id===itemId) : null;
  const cats=['Revestimentos','Rejuntes','Argamassas','Pedras','Tintas','Metais e louças','Marcenaria','Iluminação'];
  return `
  <div class="crumb"><button onclick="nav('archProject',{projectId:'${p.id}'})">← ${esc(p.name)}</button></div>
  <div class="page-head"><div><h1>${editing?'Alterar especificação':'Nova especificação'}</h1><div class="sub">${editing?`A versão atual é v${editing.version}. Ao salvar, uma nova versão é registrada e a confirmação anterior do cliente deixa de valer para este item.`:'Este item entra no projeto como pendente até o cliente confirmar.'}</div></div></div>
  <form class="form" onsubmit="event.preventDefault(); saveItem('${p.id}','${itemId||''}')">
    <div class="field-row">
      <div class="field"><label>Ambiente</label><input id="itEnv" required value="${esc(editing?editing.environment:environment)}" placeholder="Ex.: Sala de estar"></div>
      <div class="field"><label>Item</label><input id="itName" required value="${esc(editing?editing.itemName:'')}" placeholder="Ex.: Piso"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Categoria</label><select id="itCat">${cats.map(c=>`<option ${editing&&editing.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Marca / fabricante</label><input id="itBrand" value="${esc(editing?editing.brand:'')}" placeholder="Ex.: Portobello"></div>
    </div>
    <div class="field"><label>Produto especificado</label><input id="itProduct" required value="${esc(editing?editing.productName:'')}" placeholder="Ex.: Porcelanato Munari Grigio"></div>
    <div class="field"><label>Detalhes</label><input id="itDetails" value="${esc(editing?editing.details:'')}" placeholder="Ex.: 60x60 cm · acetinado · retificado"></div>
    <div class="field"><label>${editing?'Motivo da alteração':'Observações'} ${editing?'':'<span style=\"font-weight:400;color:var(--acinzentado)\">(opcional)</span>'}</label>
      <textarea id="itNotes" ${editing?'required':''} placeholder="${editing?'Ex.: produto saiu de linha; cliente pediu troca por questão de manutenção.':'Informações adicionais sobre esta especificação.'}"></textarea>
      ${editing?'<div class="hint">Este texto fica visível no histórico e para o cliente — escreva como se estivesse explicando a mudança para ele.</div>':''}
    </div>
    <div class="form-actions">
      <button type="button" class="btn ghost" onclick="nav('archProject',{projectId:'${p.id}'})">Cancelar</button>
      <button class="btn" type="submit">${editing?'Salvar nova versão e enviar para confirmação':'Adicionar e enviar para confirmação'}</button>
    </div>
  </form>`;
}
function saveItem(projectId,itemId){
  const p=findProject(projectId); if(!p)return;
  const environment=document.getElementById('itEnv').value.trim();
  const itemName=document.getElementById('itName').value.trim();
  const category=document.getElementById('itCat').value;
  const brand=document.getElementById('itBrand').value.trim();
  const productName=document.getElementById('itProduct').value.trim();
  const details=document.getElementById('itDetails').value.trim();
  const notes=document.getElementById('itNotes').value.trim();
  if(!environment||!itemName||!productName)return;
  if(!itemId){
    const item={id:uid('i'),environment,itemName,category,brand,productName,details,notes,version:1,status:'pendente'};
    p.items.push(item);
    p.history.unshift({id:uid('h'),itemId:item.id,itemName,type:'proposta',actor:'arquiteto',actorName:state.account.name,date:fmtNow(),oldValue:'—',newValue:`${brand} — ${productName}${details?' · '+details:''}`,reason:notes||'Especificação inicial.'});
  }else{
    const item=p.items.find(i=>i.id===itemId); if(!item)return;
    const oldSummary=`${item.brand} — ${item.productName}${item.details?' · '+item.details:''}`;
    item.environment=environment;item.itemName=itemName;item.category=category;item.brand=brand;item.productName=productName;item.details=details;item.version+=1;item.status='pendente';
    p.history.unshift({id:uid('h'),itemId:item.id,itemName,type:'alteracao',actor:'arquiteto',actorName:state.account.name,date:fmtNow(),oldValue:oldSummary,newValue:`${brand} — ${productName}${details?' · '+details:''}`,reason:notes});
  }
  p.updatedAt=fmtNow(); saveState();
  toast('Registrado. O item ficará pendente até o cliente confirmar.');
  nav('archProject',{projectId:p.id});
}

function archTimeline(projectId){
  const p=findProject(projectId); if(!p)return '';
  return `
  <div class="crumb"><button onclick="nav('archProject',{projectId:'${p.id}'})">← ${esc(p.name)}</button></div>
  <div class="page-head">
    <div><h1>Linha do tempo de decisões</h1><div class="sub">Todo evento registrado neste projeto, na ordem em que aconteceu, com quem propôs e quem confirmou.</div></div>
    <div class="actions-row"><button class="btn secondary" onclick="printTimeline('${p.id}')">Exportar linha do tempo</button></div>
  </div>
  <div class="panel"><div class="panel-body">
    <div class="timeline">
      ${p.history.length?p.history.map(h=>timelineEntry(h)).join(''):'<div class="empty">Nenhum evento registrado ainda.</div>'}
    </div>
  </div></div>`;
}
function timelineEntry(h){
  const isClient=h.actor==='cliente';
  return `<div class="tl-entry">
    <div class="tl-dot ${isClient?'client':''}"></div>
    <div class="tl-when">${esc(h.date)}</div>
    <div class="tl-actor ${isClient?'client':'arch'}">${isClient?'Cliente':'Arquiteto'} — ${esc(h.actorName)}</div>
    <div class="tl-what">${h.type==='aprovacao'?`Confirmou a especificação de <b>${esc(h.itemName)}</b>.`:h.type==='proposta'?`Registrou a especificação de <b>${esc(h.itemName)}</b>.`:`Alterou a especificação de <b>${esc(h.itemName)}</b>.`}</div>
    ${h.newValue?`<div class="tl-diff">${h.oldValue&&h.oldValue!=='—'?`<b>Antes:</b> ${esc(h.oldValue)}<br>`:''}<b>${h.oldValue&&h.oldValue!=='—'?'Depois':'Especificado'}:</b> ${esc(h.newValue)}${h.reason?`<br><b>Motivo:</b> ${esc(h.reason)}`:''}</div>`:''}
  </div>`;
}
function printTimeline(projectId){
  const p=findProject(projectId); if(!p)return;
  const w=window.open('','_blank','width=880,height=900');
  if(!w){toast('Permita pop-ups para exportar o documento.');return}
  const rows=p.history.map(h=>{
    const isClient=h.actor==='cliente';
    const label=h.type==='aprovacao'?'Confirmação do cliente':h.type==='proposta'?'Especificação registrada':'Alteração de especificação';
    return `<tr>
      <td class="d">${esc(h.date)}</td>
      <td class="a">${isClient?'Cliente':'Arquiteto'}<br><span>${esc(h.actorName)}</span></td>
      <td>
        <strong>${esc(label)} — ${esc(h.itemName)}</strong>
        ${h.newValue?`<div class="v">${h.oldValue&&h.oldValue!=='—'?`Antes: ${esc(h.oldValue)}<br>`:''}${h.oldValue&&h.oldValue!=='—'?'Depois':'Especificado'}: ${esc(h.newValue)}</div>`:''}
        ${h.reason?`<div class="r">Motivo/observação: ${esc(h.reason)}</div>`:''}
      </td>
    </tr>`;
  }).join('');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Linha do tempo — ${esc(p.name)}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#27343b;max-width:900px;margin:36px auto;line-height:1.5}
    h1{color:#18485F;margin-bottom:2px;font-size:22px}
    .meta{color:#4A5C6A;font-size:13px;margin-bottom:22px}
    table{width:100%;border-collapse:collapse}
    td{border-bottom:1px solid #dfe4e6;padding:10px 8px;font-size:13px;vertical-align:top}
    td.d{width:130px;color:#4A5C6A;font-size:12px}
    td.a{width:110px;color:#18485F;font-weight:600;font-size:12.5px}
    td.a span{font-weight:400;color:#4A5C6A;font-size:11.5px}
    .v{color:#4A5C6A;font-size:12.5px;margin-top:4px;background:#F8FAFA;border:1px solid #e6eaeb;border-radius:4px;padding:6px 8px}
    .r{color:#4A5C6A;font-size:12.5px;margin-top:4px;font-style:italic}
    .disclaimer{margin-top:26px;font-size:11px;color:#4A5C6A;border-top:1px solid #dfe4e6;padding-top:12px}
  </style></head><body>
  <h1>Linha do tempo de decisões</h1>
  <div class="meta">Projeto: <strong>${esc(p.name)}</strong> · Cliente: ${esc(p.client||'não informado')} ${p.ref?'· Ref.: '+esc(p.ref):''} · Documento gerado em ${esc(fmtNow())}</div>
  <table>${rows||'<tr><td>Nenhum evento registrado.</td></tr>'}</table>
  <div class="disclaimer">Documento gerado a partir do registro de eventos da plataforma Hefestos, em ordem cronológica de proposição e confirmação. Protótipo de demonstração — a versão comercial inclui validação adicional de identidade e integridade do registro.</div>
  <scr`+`ipt>window.onload=()=>window.print()<\/scr`+`ipt></body></html>`);
  w.document.close();
}

/* ============ CLIENT SHELL ============ */
function viewClientShell(){
  let body='';
  if(route==='clientPortal') body=clientPortal(ctx.projectId||state.projects[0]?.id);
  else if(route==='clientHistory') body=clientHistory(ctx.projectId, ctx.itemId);
  return `
  <div class="client-hero"><div class="shell">
    <div class="eyebrow">LINK DE CONFIRMAÇÃO · SEM NECESSIDADE DE CONTA</div>
    <h1>Especificações do seu projeto</h1>
    <p>Aqui você acompanha o que foi especificado para o seu projeto e confirma o que está de acordo. Cada confirmação fica registrada com seu nome e a data.</p>
  </div></div>
  ${body}`;
}

function clientPortal(projectId){
  const p=findProject(projectId); if(!p)return `<div class="client-body"><div class="empty">Projeto não encontrado.</div></div>`;
  const envs=[...new Set(p.items.map(i=>i.environment))];
  return `<div class="client-body">
    <div class="page-head" style="margin-bottom:18px">
      <div><h1 style="font-size:19px">${esc(p.name)}</h1><div class="sub">Arquiteto responsável: ${esc(state.account.name)} ${p.ref?'· '+esc(p.ref):''}</div></div>
      <div class="actions-row"><button class="btn ghost small" onclick="nav('archTimeline',{projectId:'${p.id}'});setTimeout(()=>document.getElementById('db-arch').click?.(),0)">Ver linha do tempo completa</button></div>
    </div>
    ${envs.map(env=>`
      <h3 style="font-size:13px;color:var(--acinzentado);margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--claro)">${esc(env)}</h3>
      ${p.items.filter(i=>i.environment===env).map(item=>clientItemCard(p,item)).join('')}
    `).join('')}
    <p class="foot-note">Este link foi enviado por ${esc(state.account.name)} para acompanhamento das especificações deste projeto. Nenhum cadastro é necessário para confirmar.</p>
  </div>`;
}

function clientItemCard(p,item){
  const lastConfirm = p.history.find(h=>h.itemId===item.id && h.type==='aprovacao');
  return `<div class="pending-card ${item.status==='pendente'?'is-pending':''}">
    <div class="top">
      <div>
        <h3>${esc(item.itemName)} <span class="ver-badge">v${item.version}</span></h3>
        <div class="prod" style="color:var(--acinzentado);font-size:13.5px">${esc(item.brand)} — ${esc(item.productName)}${item.details?' · '+esc(item.details):''}</div>
      </div>
      <span class="status-badge ${item.status}">${item.status==='aprovado'?'Confirmado':'Aguardando sua confirmação'}</span>
    </div>
    ${item.notes?`<div class="desc">${esc(item.notes)}</div>`:''}
    ${item.status==='pendente'?`
      <div class="confirm-row">
        <input id="cname-${item.id}" placeholder="Seu nome completo">
        <button class="btn small" onclick="clientConfirm('${p.id}','${item.id}')">Confirmar esta especificação</button>
      </div>`:`
      <div class="confirm-row" style="border-top:none;padding-top:0;margin-top:10px">
        <div class="confirmed-note">Confirmado por ${esc(lastConfirm?lastConfirm.actorName:item.confirmedBy||p.client)} em ${esc(lastConfirm?lastConfirm.date:item.confirmedAt||'')}</div>
      </div>`}
  </div>`;
}
function clientConfirm(projectId,itemId){
  const p=findProject(projectId); if(!p)return;
  const item=p.items.find(i=>i.id===itemId); if(!item)return;
  const input=document.getElementById('cname-'+itemId);
  const name=input.value.trim();
  if(!name){toast('Digite seu nome para confirmar.');return}
  item.status='aprovado';
  p.history.unshift({id:uid('h'),itemId:item.id,itemName:item.itemName,type:'aprovacao',actor:'cliente',actorName:name,date:fmtNow(),reason:''});
  p.updatedAt=fmtNow(); saveState();
  toast('Confirmação registrada com seu nome e a data de hoje.');
  nav('clientPortal',{projectId:p.id});
}

render();
</script>
